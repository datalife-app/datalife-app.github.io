<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.googleusercontent.com; connect-src 'self' https://*.googleapis.com https://www.gstatic.com; frame-src https://*.firebaseapp.com https://accounts.google.com https://apis.google.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="noindex, nofollow">
  <title>Lista de compras · DataLife</title>
  <meta name="description" content="Lista do mercado por corredor, com os itens de sempre a um toque.">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#110c17">
  <meta name="apple-mobile-web-app-title" content="DataLife">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <script src="js/tema.js"></script>
  <link rel="preload" href="assets/fonts/red-hat-text-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/schibsted-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/temas.css">
  <link rel="stylesheet" href="css/ferramentas.css">
  <link rel="stylesheet" href="css/compras.css">
</head>

<body class="is-loading">
  <div id="local-banner"></div>
  <header class="topbar">
    <div class="container topbar-inner">
      <a href="hub.html" class="brand"><svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke-width="10"><path d="M33.19 15.04A17 17 0 0 1 33.19 48.96" style="stroke:var(--p-100)"/><path d="M30.81 48.96A17 17 0 0 1 15.01 31.41" style="stroke:var(--p-200)"/><path d="M15.26 29.05A17 17 0 0 1 30.81 15.04" style="stroke:var(--p-300)"/></g></svg><span>Data<em>Life</em></span></a>
      <div class="topbar-right">
        <button class="icon-btn" id="btn-tema" type="button" title="Tema" aria-label="Tema"></button>
        <button class="icon-btn" id="btn-logout" title="Sair" aria-label="Sair"></button>
      </div>
    </div>
  </header>

  <main class="container view" id="view-compras">
    <div class="page-head">
      <div>
        <a href="hub.html" class="back-link" data-back>Hub</a>
        <h1>Lista de compras</h1>
        <p>Por corredor, na ordem do mercado. Toque no item quando ele for para o carrinho.</p>
      </div>
      <div class="page-head-actions">
        <div class="month-nav day-nav">
          <button class="icon-btn" id="dia-prev" type="button" aria-label="Dia anterior"></button>
          <div class="day-label" aria-live="polite"><strong id="dia-label"></strong><span id="dia-sub"></span></div>
          <button class="icon-btn" id="dia-next" type="button" aria-label="Próximo dia"></button>
        </div>
        <button class="btn btn-ghost btn-sm" type="button" id="dia-hoje" hidden>Hoje</button>
      </div>
    </div>

    <section class="orc-semana" id="orc-semana" aria-label="Orçamento do mercado"></section>

    <form class="add-bar" id="add-form" autocomplete="off">
      <input class="input" name="item" id="add-item" maxlength="80" placeholder='Adicionar item (ex.: "2 kg arroz")' aria-label="Adicionar item">
      <button class="btn btn-primary" type="submit" id="add-btn"></button>
    </form>
    <section class="sempre" id="sempre" aria-label="Itens de sempre" hidden>
      <h2 class="sub-title">De sempre</h2>
      <div class="sempre-list" id="sempre-list"></div>
    </section>

    <div class="lista" id="lista"></div>
    <div class="totais" id="totais" hidden></div>
    <div class="concluir-bar"><button class="btn btn-primary" type="button" id="btn-limpar" disabled></button></div>
  </main>

  <dialog class="dialog dialog-sm" id="item-dialog" aria-labelledby="item-title">
    <form method="dialog" class="dialog-inner" id="item-form" autocomplete="off">
      <header class="dialog-head">
        <div><h2 class="dialog-title" id="item-title">Item</h2></div>
        <button class="icon-btn" type="button" data-close aria-label="Fechar"></button>
      </header>
      <div class="form-body">
        <label class="field"><span class="field-label">Item</span><input class="input" name="nome" maxlength="60" required></label>
        <div class="form-grid">
          <label class="field"><span class="field-label">Quantidade</span><input class="input" name="qtd" maxlength="20" placeholder="Ex.: 2 kg, 6 un"></label>
          <label class="field"><span class="field-label">Preço (opcional)</span><input class="input num" name="preco" inputmode="numeric" placeholder="R$ 0,00" maxlength="22"></label>
          <label class="field form-wide"><span class="field-label">Corredor</span><select class="input" name="cat" aria-label="Corredor"></select></label>
        </div>
      </div>
      <footer class="dialog-foot">
        <button class="btn btn-ghost btn-sm danger-btn" type="button" id="item-excluir">Remover</button>
        <div class="dialog-actions">
          <button class="btn btn-ghost" type="button" data-close>Cancelar</button>
          <button class="btn btn-primary" type="submit">Salvar</button>
        </div>
      </footer>
    </form>
  </dialog>

  <script type="module" src="js/compras.js"></script>
</body>

</html>
